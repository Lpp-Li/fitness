<title>我的健身</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F1115'/%3E%3Cpath d='M8 20h4v-8H8zM20 20h4v-8h-4zM12 15h8v2h-8z' fill='%233DDC97'/%3E%3C/svg%3E">
<style>
/* §A 设计变量 */
:root{
  --bg:#0F1115; --card:#171A21; --line:#242833; --accent:#3DDC97; --warn:#FF7A45;
  --muted:#8B93A7; --text:#E6E9F0; --radius:14px; --gap:20px;
  --accent-dim:rgba(61,220,151,.12); --warn-dim:rgba(255,122,69,.12);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2b3140;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* §B 布局骨架 */
#app{display:flex;height:100vh}
#side{width:220px;flex:0 0 220px;border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:#0c0e12}
.brand{font-weight:700;font-size:15px;padding:8px 10px 16px;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--muted);background:none;border:0;text-align:left;width:100%;font-size:14px}
.nav-item:hover{background:#151821;color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent);font-weight:600}
.nav-item .ico{width:18px;text-align:center;font-size:15px}
.side-foot{margin-top:auto;padding:8px 10px;color:#5c6478;font-size:12px;min-height:20px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);gap:16px}
#today{color:var(--muted);font-size:13px}
#today b{color:var(--text);font-weight:600}
#pillbox{display:flex;align-items:center;gap:10px}
#view{flex:1;overflow:auto;padding:24px 28px 40px}
.wrap{max-width:1240px;margin:0 auto}
@media (max-width:1100px){
  #side{width:60px;flex:0 0 60px;padding:12px 6px}
  .brand{font-size:0;padding:10px 0 14px;text-align:center}
  .brand::after{content:"💪";font-size:18px}
  .nav-item{justify-content:center;padding:10px 0}
  .nav-item .label{display:none}
  .side-foot{display:none}
}
@media (max-width:860px){ #view{padding:16px} }

/* §C 通用组件 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card+.card{margin-top:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
.card-t{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-sub{color:var(--muted);font-size:12px}
.btn{background:#1e2330;border:1px solid var(--line);border-radius:10px;padding:9px 16px;color:var(--text);font-size:14px;transition:.15s}
.btn:hover{background:#262c3b;border-color:#313849}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#08130d;font-weight:600}
.btn-primary:hover{background:#4ee6a6;border-color:#4ee6a6}
.btn-danger{background:transparent;border-color:#4a2a22;color:var(--warn)}
.btn-danger:hover{background:var(--warn-dim)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:#1e2330;color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.field{background:#11141b;border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;outline:none;transition:.15s}
.field:focus{border-color:var(--accent);background:#0e1117}
select.field{appearance:none;cursor:pointer}
.row{display:flex;gap:12px;align-items:center}
.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
@media (max-width:1000px){ .grid-2{grid-template-columns:1fr} }
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:#20263a;color:#9aa4bd;font-size:11px}
.divider{height:1px;background:var(--line);margin:14px 0}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .em{font-size:28px;display:block;margin-bottom:10px;opacity:.6}
.bar{height:6px;border-radius:3px;background:#20242f;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.bar.warn>i{background:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-dim);border:1px solid rgba(61,220,151,.3);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer}
.pill.done{background:var(--warn-dim);border-color:rgba(255,122,69,.4);color:var(--warn);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}

/* 抽屉 */
#layer{position:fixed;inset:0;pointer-events:none;z-index:60}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);pointer-events:auto;opacity:0;transition:.2s}
.scrim.show{opacity:1}
.drawer{position:absolute;top:0;right:0;height:100%;width:480px;max-width:92vw;background:#12151c;border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;pointer-events:auto;display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-b{flex:1;overflow:auto;padding:18px 20px}
.drawer-f{padding:14px 20px;border-top:1px solid var(--line)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);background:#151922;border:1px solid var(--line);border-radius:16px;width:420px;max-width:92vw;padding:22px;pointer-events:auto;opacity:0;transition:.18s}
.modal.show{opacity:1;transform:translate(-50%,-50%)}
.modal-t{font-size:16px;font-weight:600;margin-bottom:8px}
.modal-b{color:var(--muted);font-size:14px;white-space:pre-line;margin-bottom:18px}
.modal-f{display:flex;justify-content:flex-end;gap:10px}
.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#1c2230;border:1px solid var(--line);border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:14px;pointer-events:auto;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast button{background:none;border:0;color:var(--accent);font-weight:600;padding:0}

/* §D 各页样式 */
.ring-wrap{position:relative;width:260px;height:260px;margin:6px auto 0}
.ring{width:260px;height:260px;display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ring-time{font-size:50px;font-weight:700;letter-spacing:1px;line-height:1}
#view textarea.field{min-height:88px;resize:vertical;font-family:inherit}
.checkline{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #1d2130}
.checkline:last-child{border-bottom:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;flex:0 0 7px}
.dot.off{background:#3a4053}
.tag-muscle{background:#1b2a25;color:#7fd7b0}

/* 今日计划 */
.ex{margin-top:12px}
.ex.skipped{opacity:.45}
.idx{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#20263a;color:#9aa4bd;font-size:11px;align-items:center;justify-content:center;margin-right:2px}
.ex-last{color:#6f7890;font-size:12px;margin:-2px 0 10px}
.sets{display:flex;flex-direction:column;gap:6px;max-width:420px}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 38px;gap:8px;align-items:center}
.setrow.done .field{color:var(--accent);border-color:rgba(61,220,151,.35)}
.setno{color:#5d6578;font-size:12px;text-align:center}
.setchk{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#151a24;color:var(--accent);font-size:15px;line-height:1}
.setchk.on{background:var(--accent-dim);border-color:var(--accent)}
.pickrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #1d2130}
.today-head{margin-bottom:2px}

/* 健身计划 */
.tpl-row{display:flex;align-items:center;gap:9px;padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.tpl-row:hover{background:#151a24}
.tpl-row.on{background:var(--accent-dim);border-color:rgba(61,220,151,.28)}
.tpl-name{font-weight:600;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl-row .tiny{flex:0 0 auto}
.tpl-item{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px;background:#12151c;cursor:grab}
.tpl-item:active{cursor:grabbing}
.tpl-line{display:flex;align-items:center;gap:8px}
.grip{color:#4d5568;font-size:14px;flex:0 0 auto}
.tpl-controls{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;color:var(--muted);font-size:12px}
.tpl-controls label{display:flex;align-items:center;gap:5px}
.tpl-controls .field{width:64px;padding:5px 7px;font-size:13px;text-align:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.week-cell{background:#12151c;border:1px solid var(--line);border-radius:12px;padding:12px}
.week-cell .field{padding:6px 8px;font-size:13px;margin-top:8px}
@media (max-width:1150px){ .week{grid-template-columns:repeat(4,1fr)} }

/* 首页 */
.home-kcal{font-size:26px;font-weight:700;letter-spacing:.5px}
.note-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid #1d2130}
.note-row:last-child{border-bottom:0}
.note-row.done{opacity:.45}
.note-row.done .note-text{text-decoration:line-through}
.note-check{width:20px;height:20px;flex:0 0 20px;border-radius:6px;border:1px solid var(--line);background:#151a24;color:var(--accent);font-size:12px;line-height:1}
.note-row.done .note-check{background:var(--accent-dim);border-color:var(--accent)}
.note-text{flex:1;font-size:13px;word-break:break-word}
#memoInput{min-height:64px}

/* 饮食计划 */
.food-row{display:grid;grid-template-columns:1fr 62px 74px 1fr 28px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #1d2130}
.food-row:last-child{border-bottom:0}
.food-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.form-grid .field{padding:7px 9px;font-size:13px}

/* 数据与设置 */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat-num{font-size:20px;font-weight:700;margin-top:6px;letter-spacing:.3px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 0;border-bottom:1px solid #1d2130}
.heat{display:grid;grid-template-columns:repeat(26,1fr);grid-template-rows:repeat(7,10px);grid-auto-flow:column;gap:3px}
.heat i{border-radius:2px;display:block;width:100%;height:10px}
.form-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.form-row label{width:70px;color:var(--muted);font-size:13px}
@media (max-width:900px){ .stat-grid{grid-template-columns:repeat(2,1fr)} }

/* ============ 手机端（≤720px）：底部标签栏 + 单列 ============ */
@media (max-width:720px){
  #app{flex-direction:column}
  #main{flex:1;min-height:0;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  #side{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;flex:0 0 auto;height:auto;
    flex-direction:row;align-items:stretch;gap:0;border-right:0;border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50;
    background:rgba(12,14,18,.96);backdrop-filter:blur(8px);
  }
  .brand{display:none}
  #nav{display:flex;flex:1;gap:2px}
  .nav-item{flex:1;flex-direction:column;gap:3px;padding:7px 2px;border-radius:9px;justify-content:center}
  .nav-item .ico{font-size:17px;width:auto}
  .nav-item .label{display:block;font-size:10px;line-height:1;letter-spacing:.2px}
  .nav-item.active{background:var(--accent-dim)}
  .side-foot{display:none}
  #topbar{height:auto;flex:0 0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;gap:8px;font-size:12px}
  #today{font-size:12px}
  #view{padding:14px 14px 24px}
  .wrap{max-width:none}
  .card{padding:15px;border-radius:13px}
  .card+.card{margin-top:12px}
  .card-t{font-size:14px}
  .card-h{flex-wrap:wrap;gap:8px}
  .ex .card-h .card-sub{flex:0 0 100%;text-align:left;margin-top:2px}
  .food-row{grid-template-columns:1fr 52px 62px 30px}
  .grid-2{grid-template-columns:1fr!important;gap:12px}
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
  .stat-num{font-size:18px}
  .week{grid-template-columns:repeat(2,1fr);gap:8px}
  .form-row{flex-wrap:wrap}
  .form-row label{width:100%}
  .form-grid{grid-template-columns:1fr 1fr}
  .home-kcal{font-size:24px}
  /* 触控尺寸 */
  .btn{padding:11px 15px;border-radius:10px}
  .btn-sm{padding:8px 12px}
  .field,input,select,textarea{font-size:16px}
  .tpl-controls .field{width:58px;font-size:16px}
  .setrow{grid-template-columns:22px 1fr 1fr 46px;gap:6px}
  .setchk{width:46px;height:46px;font-size:17px}
  .setrow .field{padding:10px 8px}
  .ring-wrap,.ring{width:230px;height:230px}
  .ring-time{font-size:44px}
  /* 抽屉与弹窗占满 */
  .drawer{width:100%;max-width:100%}
  .drawer-b{padding:14px}
  .modal{width:calc(100% - 24px);padding:18px}
  .toast{left:12px;right:12px;transform:none;justify-content:space-between;bottom:calc(74px + env(safe-area-inset-bottom))}
  /* 表格：窄屏去掉次要列 */
  .food-row{grid-template-columns:1fr 52px 62px 30px;gap:6px}
  .food-row .macro{display:none}
  .tbl th:nth-child(3),.tbl td:nth-child(3){display:none}
  .heat{grid-template-columns:repeat(26,1fr);gap:2px}
  .heat i{height:8px}
  .pill{padding:5px 10px}
  .pill-meta{display:none}
  .tpl-row{padding:11px 10px}
  .note-text{font-size:14px}
  .checkline{padding:11px 0}
}
</style>

/* ============================================================
   §2 工具函数
   ============================================================ */

function uid(){ return (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function todayKey(d){ d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function dateFromKey(k){ var p = String(k).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(k, n){ var d = dateFromKey(k); d.setDate(d.getDate() + n); return todayKey(d); }
function weekdayIndex(k){ var w = dateFromKey(k).getDay(); return w === 0 ? 6 : w - 1; } // 周一=0
function round1(n){ return Math.round(n * 10) / 10; }
function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
function sum(arr, f){ return arr.reduce(function (s, x) { return s + (f ? f(x) : x); }, 0); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtDur(sec){ sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + pad2(s); }
function fmtDurCn(sec){
  sec = Math.round(sec);
  if (sec < 60) return sec + ' 秒';
  var m = Math.floor(sec / 60), s = sec % 60;
  if (m < 60) return s ? m + ' 分 ' + s + ' 秒' : m + ' 分钟';
  var h = Math.floor(m / 60); m = m % 60;
  return m ? h + ' 小时 ' + m + ' 分' : h + ' 小时';
}
function relTime(ts){
  var d = Date.now() - ts, m = Math.floor(d / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  var h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  return Math.floor(h / 24) + ' 天前';
}
function fmtDateCn(k){ var d = dateFromKey(k); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
function volume(kg, reps){ return (Number(kg) || 0) * (Number(reps) || 0); }
function capVolume(v){ return v >= 1000 ? round1(v / 1000) + ' t' : Math.round(v) + ' kg'; }

var _ac = null, _flash = null, _flashT = null;
function beep(){
  try {
    if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
    if (_ac.state === 'suspended') _ac.resume();
    var t0 = _ac.currentTime;
    [0, 0.26, 0.52].forEach(function (d, i) {
      var o = _ac.createOscillator(), g = _ac.createGain();
      o.type = 'sine';
      o.frequency.value = i === 2 ? 1046 : 784;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.20);
      o.connect(g); g.connect(_ac.destination);
      o.start(t0 + d); o.stop(t0 + d + 0.22);
    });
  } catch (e) {}
}
function flashTitle(){
  clearInterval(_flash); clearTimeout(_flashT);

  _flashT = setTimeout(stopFlash, 8000);
}

var Timer = {
  _s: { total: 0, endsAt: 0, remainMs: 0, running: false, done: false, meta: null, _iv: null },
  state: function () {
    var s = this._s;
    return { total: s.total, remain: this.remainMs(), running: s.running, done: s.done, meta: s.meta };
  },
  remainMs: function () {
    var s = this._s;
    return s.running ? Math.max(0, s.endsAt - Date.now()) : Math.max(0, s.remainMs);
  },
  start: function (sec, meta) {
    var s = this._s;
    sec = Math.max(1, Number(sec) || 1);
    s.total = sec; s.remainMs = sec * 1000; s.endsAt = Date.now() + sec * 1000;
    s.running = true; s.done = false;
    if (meta !== undefined) s.meta = meta;
    try { if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)(); if (_ac.state === 'suspended') _ac.resume(); } catch (e) {}
    stopFlash();
    this._ensure();
    this.tick();
  },
  pause: function () {
    var s = this._s;
    if (!s.running) return;
    s.remainMs = this.remainMs(); s.running = false; this._stop(); this.tick();
  },
  resume: function () {
    var s = this._s;
    if (s.running || s.remainMs <= 0) return;
    s.endsAt = Date.now() + s.remainMs; s.running = true; s.done = false; this._ensure(); this.tick();
  },
  toggle: function () { if (this._s.running) this.pause(); else if (this._s.remainMs > 0) this.resume(); },
  add: function (sec) {
    var s = this._s, ms = sec * 1000;
    if (s.running) { s.endsAt += ms; s.total += sec; }
    else { s.remainMs = Math.max(1000, s.remainMs + ms); s.total += sec; }
    if (s.total < 1) s.total = 1;
    this.tick();
  },
  reset: function () {
    var s = this._s, t = s.total || (db ? db.settings.defaultRest : 90);
    this.start(t, s.meta);
  },
  clear: function () {
    var s = this._s;
    s.total = 0; s.remainMs = 0; s.running = false; s.done = false; s.meta = null;
    this._stop(); this.tick();
  },
  _ensure: function () {
    var s = this._s;
    if (s._iv) return;
    s._iv = setInterval(function () { Timer.tick(); }, 250);
  },
  _stop: function () { var s = this._s; if (s._iv) { clearInterval(s._iv); s._iv = null; } },
  tick: function () {
    var s = this._s;
    var rem = this.remainMs();
    var el = document.getElementById('restTime');
    if (el) {
      el.textContent = fmtDur(rem / 1000);
      var ring = document.getElementById('restRing');
      if (ring) {
        var C = 703.72, frac = s.total > 0 ? clamp(rem / (s.total * 1000), 0, 1) : 1;
        ring.setAttribute('stroke-dashoffset', String(C * (1 - frac)));
        ring.style.stroke = s.done ? 'var(--warn)' : 'var(--accent)';
      }
      var metaEl = document.getElementById('restMeta');
      if (metaEl) metaEl.textContent = s.meta ? s.meta.name : '自由休息';
    }
    if (s.running && rem <= 0) { this.finish(); return; }
    this.updatePill();
  },
  finish: function () {
    var s = this._s;
    s.running = false; s.remainMs = 0; s.done = true;
    this._stop();
    if (s.total > 0 && db) {
      db.restLogs.unshift({ at: Date.now(), sec: s.total, exerciseName: s.meta ? s.meta.name : null });
      db.restLogs = db.restLogs.slice(0, 20);
      save();
    }
    beep(); flashTitle();
    this.updatePill();
    if (ui.view === 'rest') render();
  },
  updatePill: function () {
    var box = document.getElementById('pillbox');
    if (!box) return;
    var s = this._s;
    if (!s.total) { if (box.innerHTML) box.innerHTML = ''; return; }
    if (s.done) {
      box.innerHTML = '<span class="pill done" data-act="go" data-view="rest">⏰ 休息结束</span>';
    } else if (s.running) {
      box.innerHTML = '<span class="pill" data-act="go" data-view="rest">⏱ ' + fmtDur(this.remainMs() / 1000) + (s.meta ? '<span class="pill-meta"> · ' + esc(s.meta.name) + '</span>' : '') + '</span>';
    } else {
      box.innerHTML = '<span class="pill" data-act="go" data-view="rest">⏸ ' + fmtDur(this.remainMs() / 1000) + '</span>';
    }
  }
};

function entriesOf(s){ return (s && s.entries) || []; }
function findEntry(s, exId){ return entriesOf(s).filter(function (e) { return e.exerciseId === exId; })[0] || null; }
function lastSessionFor(exId, beforeTs){
  var list = (db.sessions || []).filter(function (s) {
    return (!beforeTs || s.endedAt < beforeTs) && findEntry(s, exId);
  });
  list.sort(function (a, b) { return b.endedAt - a.endedAt; });
  return list[0] || null;

}
function prefillSets(exId, item, beforeTs){
  var last = lastSessionFor(exId, beforeTs);
  var done = last ? perfSets(last, exId) : [];
  var out = [];
  for (var i = 0; i < item.sets; i++) {
    var p = done[i];
    out.push({
      weight: p && p.weight !== '' && p.weight != null ? p.weight : item.weight,
      reps: p && p.reps !== '' && p.reps != null ? p.reps : item.repsMax,
      done: false

  }
  return out;
}

}

      '<div style="margin-top:16px"><button class="btn" data-act="free-start">自由训练</button></div></div></div>';
  }

      '<div class="card-sub">' + tpl.items.length + ' 个动作 · ' + totalSets + ' 组 · 约 ' + est + ' 分钟</div></div>' +

      '<button class="btn" data-act="today-menu">⋯</button></div></div></div>' + preview;
  }

  // 进行中
  var st = draftStats(draft);
  var pct = st.totalSets ? Math.round(st.doneSets / st.totalSets * 100) : 0;
  return '<div class="today-head">' +
    '<div class="card"><div class="card-h">' +
      '<div><div class="card-t" style="font-size:18px">' + esc(draft.name) + ' <span class="tag">进行中</span></div>' +
      '<div class="card-sub">' + draft.entries.filter(function (e) { return !e.skipped; }).length + ' 个动作 · ' + st.totalSets + ' 组</div></div>' +
      '<div class="row"><button class="btn btn-primary" data-act="today-end">结束训练</button>' +
      '<button class="btn" data-act="today-menu">⋯</button></div>' +
    '</div>' +
    '<div class="bar"><i id="todayBar" style="width:' + pct + '%"></i></div>' +
    '<div class="row small muted" style="justify-content:space-between;margin-top:8px">' +
      '<span id="todayProgress">' + st.doneSets + '/' + st.totalSets + ' 组 · ' + capVolume(st.volume) + '</span>' +
      '<span id="elapsed" class="num">' + fmtDur(elapsedSec(draft.startedAt)) + '</span>' +
    '</div></div></div>' +
    draft.entries.map(function (e, i) { return entryCard(e, i, false); }).join('') +
    '<div class="row" style="margin-top:16px"><button class="btn" data-act="ex-add">+ 加练一个动作</button></div>';

function switchTodayTemplate(tplId){

      db.draft.date = todayKey();

    confirmBox({ title: '换模板会清空已完成的组', body: '当前已打了 ' + draftStats(db.draft).doneSets + ' 组，换模板后这些记录会消失。', okText: '继续换' })

function endTraining(){  var d = db.draft;
  if (!d) return;
  var st = draftStats(d);
  endTrainingModal(d, st).then(function (res) {
    if (!res.ok) return;
    var entries = d.entries.filter(function (e) { return !e.skipped; }).map(function (e) {
      return { exerciseId: e.exerciseId, sets: e.sets.filter(function (s) { return s.done; }) };
    }).filter(function (e) { return e.sets.length > 0; });
    if (!entries.length) { toast('还没有完成任何一组，先打一组吧'); return; }
    var vol = sum(entries, function (e) { return sum(e.sets, function (s) { return volume(s.weight, s.reps); }); });
    var setsCount = sum(entries, function (e) { return e.sets.length; });
    db.sessions.push({
      id: d.id, date: d.date, startedAt: d.startedAt || Date.now(), endedAt: Date.now(),
      templateId: d.templateId, name: d.name, entries: entries, sets: setsCount, volume: vol, notes: res.notes || ''
    });
    db.draft = null;
    Timer.clear();
    save(); toast('训练已记录');
    go('home');
  });
}

var MEAL_KEYS = ['breakfast', 'lunch', 'dinner', 'snack'];
var MEAL_NAMES = { breakfast: '早餐', lunch: '午餐', dinner: '晚餐', snack: '加餐' };
function isPer100(food){ return /^100/.test(food.unit || ''); }
function qtyLabel(food, qty){
  if (!food) return '';
  var q = Number(qty) || 0;
  if (isPer100(food)) return Math.round(q * 100) + 'g';
  var u = String(food.unit || '').replace(/^1(?=\D)/, '');
  return q + ' ' + u;
}
function mealKcal(list){
  return sum(list || [], function (it) {
    var f = foodById(it.foodId);
    return f ? f.kcal * (Number(it.qty) || 0) : 0;
  });
}
function mealMacros(list){
  var t = { p: 0, c: 0, f: 0 };
  (list || []).forEach(function (it) {
    var f = foodById(it.foodId);
    if (!f) return;
    var q = Number(it.qty) || 0;
    t.p += f.p * q; t.c += f.c * q; t.f += f.f * q;
  });
  return t;
}
function recentFoods(){
  var seen = {}, out = [];
  var dates = Object.keys(db.meals || {}).sort().reverse();
  dates.forEach(function (dk) {
    MEAL_KEYS.forEach(function (m) {
      (mealsOf(dk)[m] || []).forEach(function (it) {
        if (seen[it.foodId]) return;
        var f = foodById(it.foodId);
        if (f) { seen[it.foodId] = 1; out.push(f); }
      });
    });
  });
  return out.slice(0, 12);
}
function suggestTargets(mode, weight){
  var w = Number(weight) || 70;
  var kcal = Math.round(mode === 'cut' ? w * 28 : w * 35);
  var p = round1(mode === 'cut' ? w * 2.0 : w * 1.8);
  var f = round1(mode === 'cut' ? w * 0.8 : w * 0.9);
  var c = round1(Math.max(0, (kcal - p * 4 - f * 9) / 4));
  return { kcal: kcal, p: p, c: c, f: f };
}

/* P7 数据与设置 */
function fmtWeight(kg){
  var v = Number(kg) || 0;
  return db.settings.unit === 'lb' ? round1(v * 2.2046) + ' lb' : round1(v) + ' kg';
}
function allSessionsSorted(){
  return (db.sessions || []).slice().sort(function (a, b) { return (b.startedAt || 0) - (a.startedAt || 0); });
}
function avgDuration(){
  var list = (db.sessions || []).filter(function (s) { return s.endedAt > s.startedAt; });
  if (!list.length) return 0;
  return Math.round(sum(list, function (s) { return (s.endedAt - s.startedAt) / 1000; }) / list.length);
}
function weeklyVolumes(n){
  var out = [];
  var start = weekStartKey();
  for (var i = n - 1; i >= 0; i--) {
    var ws = addDays(start, -7 * i);
    var we = addDays(ws, 6);
    var v = sum((db.sessions || []).filter(function (s) { return s.date >= ws && s.date <= we; }), function (s) { return s.volume || 0; });
    out.push({ start: ws, v: v });
  }
  return out;
}
function prList(){
  var map = {};
  (db.sessions || []).forEach(function (s) {
    (s.entries || []).forEach(function (e) {
      (e.sets || []).forEach(function (st) {
        var kg = Number(st.weight) || 0, reps = Number(st.reps) || 0;
        if (!kg || !reps) return;
        var cur = map[e.exerciseId];
        if (!cur || kg > cur.weight || (kg === cur.weight && reps > cur.reps)) {
          map[e.exerciseId] = { weight: kg, reps: reps, date: s.date };
        }
      });
    });
  });
  return Object.keys(map).map(function (id) {
    var o = map[id];
    o.exerciseId = id;
    o.name = (exerciseById(id) || {}).name || '已删除动作';
    return o;
  }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
}
function heatCells(){
  var cells = [], n = 26 * 7;
  var end = todayKey();
  for (var i = n - 1; i >= 0; i--) {
    var k = addDays(end, -i);
    var v = sum((db.sessions || []).filter(function (s) { return s.date === k; }), function (s) { return s.volume || 0; });
    cells.push({ d: k, v: v });
  }
  return cells;
}
function heatColor(v){
  if (!v) return '#1b1f2a';
  if (v <= 2000) return '#1f4d3b';
  if (v <= 5000) return '#2f8a63';
  return '#3DDC97';
}
function weightSeries(){
  return (db.weights || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).slice(-30);
}
function weightSvg(){
  var pts = weightSeries();
  if (pts.length < 2) return '<div class="tiny muted" style="padding:20px 0">至少记录两次体重才能画折线</div>';
  var W = 560, H = 140, pad = 10;
  var vals = pts.map(function (p) { return Number(p.kg) || 0; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (max === min) { max += 1; min -= 1; }
  var coords = pts.map(function (p, i) {

function exportPayload(){
  return { version: 1, exportedAt: new Date().toISOString(), data: db };
}
function validateBackup(obj){
  if (!obj || typeof obj !== 'object') return '不是有效的备份文件';
  var d = obj.data;
  if (!d || typeof d !== 'object') return '缺少 data 字段';
  if (!d.version) return '缺少版本信息';
  ['sessions', 'templates', 'exercises', 'foods', 'notes', 'weights'].forEach(function (k) {
    if (d[k] !== undefined && !Array.isArray(d[k])) return '字段 ' + k + ' 类型错误';
  });
  if (!Array.isArray(d.sessions)) return '缺少训练记录';
  return null;
}
function applyBackup(obj){
  var err = validateBackup(obj);
  if (err) return err;
  var d = obj.data;
  db = Object.assign(defaultDb(), d);
  db.settings = Object.assign(defaultDb().settings, d.settings || {});
  db.schedule = Object.assign(defaultDb().schedule, d.schedule || {});
  db.overrides = Object.assign({}, d.overrides || {});
  db.seeded = true;
  saveNow();
  return null;
}
function doExport(){  var payload = exportPayload();
  var json = JSON.stringify(payload, null, 2);
  db.settings.lastExportAt = Date.now();
  saveNow();
  // Android 安装包内通过原生桥接保存到「下载」目录
  if (window.AndroidBridge && window.AndroidBridge.saveFile) {
    try { window.AndroidBridge.saveFile('fitness-backup-' + todayKey() + '.json', json); return; } catch (e) {}
  }
  var blob = new Blob([json], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'fitness-backup-' + todayKey() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  toast('已导出备份');
}
function readImport(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    var obj;
    try { obj = JSON.parse(reader.result); } catch (e) { toast('文件格式不正确，无法解析'); return; }
    var err = validateBackup(obj);
    if (err) { toast('备份无效：' + err); return; }
    confirmBox({ title: '导入会覆盖当前全部数据', body: '当前数据将被备份文件替换，确定吗？', okText: '导入' })
      .then(function (ok) {
        if (!ok) return;
        var e2 = applyBackup(obj);
        if (e2) { toast('导入失败：' + e2); return; }
        ui.view = 'home'; location.hash = '#/home'; render();
        toast('已导入 ' + (db.sessions || []).length + ' 条训练记录');
      });
  };
  reader.onerror = function () { toast('读取文件失败'); };
  reader.readAsText(file);
}

function mealsOf(dk){
  var all = db.meals || {};
  var m = all[dk] || {};
  return { breakfast: m.breakfast || [], lunch: m.lunch || [], dinner: m.dinner || [], snack: m.snack || [] };
}
function foodById(id){ return (db.foods || []).filter(function (f) { return f.id === id; })[0] || null; }
function mealTotals(dk){
  var m = mealsOf(dk), t = { kcal: 0, p: 0, c: 0, f: 0 };
  ['breakfast', 'lunch', 'dinner', 'snack'].forEach(function (k) {
    (m[k] || []).forEach(function (it) {
      var f = foodById(it.foodId);
      if (!f) return;
      var q = Number(it.qty) || 0;
      t.kcal += f.kcal * q; t.p += f.p * q; t.c += f.c * q; t.f += f.f * q;
    });
  });
  return t;
}

  db.notes.splice(idx, 1);
  save(); refreshMemo();
  toast('已删除便签', {
    action: {
      text: '撤销',
      fn: function () {
        db.notes.splice(idx, 0, backup);
        save(); refreshMemo();
      }
    }
  });
}

function importDefaultPlans(){
  SEED_EXERCISES.forEach(function (x) {
    if (!db.exercises.some(function (e) { return e.name === x[0]; })) db.exercises.push({ id: uid(), name: x[0], muscle: x[1] });
  });
  if (!db.foods.length) {
    db.foods = SEED_FOODS.map(function (f, i) {
      return { id: 'f' + (i + 1), name: f[0], unit: f[1], kcal: f[2], p: f[3], c: f[4], f: f[5] };
    });
  }
  var map = {};
  db.exercises.forEach(function (e) { map[e.name] = e.id; });
  SEED_TEMPLATES.forEach(function (t) {
    if (db.templates.some(function (x) { return x.name === t[0]; })) return;
    db.templates.push({
      id: uid(), name: t[0], enabled: true,
      items: t[1].map(function (it) {
        return { exerciseId: map[it[0]], sets: it[1], repsMin: it[2], repsMax: it[3], weight: it[4], restSec: it[5] };
      })
    });
  });
  var valid = {};
  db.templates.forEach(function (t) { valid[t.id] = 1; });
  WEEK_KEYS.forEach(function (k) { if (db.schedule[k] && !valid[db.schedule[k]]) db.schedule[k] = null; });
  if (!db.schedule.mon && !db.schedule.wed && !db.schedule.fri) {
    db.schedule.mon = db.templates[0] ? db.templates[0].id : null;
    db.schedule.wed = db.templates[1] ? db.templates[1].id : null;
    db.schedule.fri = db.templates[2] ? db.templates[2].id : null;
  }
  save(); render(); toast('已导入默认模板');
}

/* ============================================================
   §8 启动与事件
   ============================================================ */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  if (act !== 'close-layer') stopFlash();
  if (act === 'go') { go(el.getAttribute('data-view')); }
  else if (act === 'close-layer') { closeLayer(); }
  else if (act === 'rest-preset') { Timer.start(+el.getAttribute('data-sec')); if (ui.view === 'rest') render(); }
  else if (act === 'rest-toggle') { Timer.toggle(); if (ui.view === 'rest') render(); }
  else if (act === 'rest-reset') { Timer.reset(); if (ui.view === 'rest') render(); }
  else if (act === 'rest-minus') { Timer.add(-15); if (ui.view === 'rest') render(); }
  else if (act === 'rest-plus') { Timer.add(15); if (ui.view === 'rest') render(); }
  else if (act === 'rest-clear') { Timer.clear(); if (ui.view === 'rest') render(); }
  else if (act === 'rest-custom') {
    var inp = document.getElementById('customSec');
    var sec = parseInt(inp && inp.value, 10);
    if (!sec || sec < 1) { toast('请输入有效的秒数'); return; }
    Timer.start(sec); if (ui.view === 'rest') render();
  }
  else if (act === 'today-start' || act === 'today-again' || act === 'free-start') {
    var tpl = act === 'free-start' ? null : resolveToday(todayKey()).template;
    if (act === 'today-again') { var l = (db.sessions || []).filter(function (s) { return s.date === todayKey(); }); tpl = l.length ? templateById(l[l.length - 1].templateId) : tpl; }
    db.draft = draftFromTemplate(tpl || null);
    db.draft.startedAt = Date.now();
    delete (db.overrides || {})[todayKey()];
    save(); toast('开始训练'); go('today'); render();
  }
  else if (act === 'set-toggle') { toggleSet(el.getAttribute('data-ex'), +el.getAttribute('data-set')); }
  else if (act === 'set-add') {
    var de = draftEntry(el.getAttribute('data-ex'));
    if (de) { var lastSet = de.sets[de.sets.length - 1] || { weight: de.targetWeight, reps: de.repsMax }; de.sets.push({ weight: lastSet.weight, reps: lastSet.reps, done: false }); save(); render(); }
  }
  else if (act === 'ex-skip' || act === 'ex-unskip') {
    var se = draftEntry(el.getAttribute('data-ex'));
    if (se) { se.skipped = act === 'ex-skip'; save(); render(); }
  }
  else if (act === 'ex-add') { openExercisePicker(); }
  else if (act === 'ex-pick') { addExtraExercise(el.getAttribute('data-ex')); }
  else if (act === 'today-menu') { openTodayMenu(); }
  else if (act === 'today-switch') { switchTodayTemplate(el.getAttribute('data-tpl')); }
  else if (act === 'today-move') { moveTodayToTomorrow(); }
  else if (act === 'today-cancel') { cancelToday(); }
  else if (act === 'today-end') { endTraining(); }
  else if (act === 'today-reset') { resetTodayRecords(); }
  else if (act === 'plan-tab') { ui.planTab = el.getAttribute('data-tab'); render(); }
  else if (act === 'plan-select') { ui.planSel = el.getAttribute('data-tpl'); render(); }
  else if (act === 'plan-new') {
    inputModal({ title: '新建模板', placeholder: '例如：上肢' }).then(function (name) {
      if (!name) return;
      var t = { id: uid(), name: name, enabled: true, items: [] };
      db.templates.push(t); ui.planSel = t.id; ui.planTab = 'tpl'; save(); render();
    });
  }
  else if (act === 'plan-rename') {
    var rt = templateById(el.getAttribute('data-tpl'));
    if (!rt) return;
    inputModal({ title: '模板改名', value: rt.name }).then(function (name) {
      if (!name) return;
      rt.name = name; save(); render();
    });
  }
  else if (act === 'plan-copy') {
    var ct = templateById(el.getAttribute('data-tpl'));
    if (!ct) return;
    var copy = JSON.parse(JSON.stringify(ct));
    copy.id = uid(); copy.name = ct.name + '（副本）';
    db.templates.push(copy); ui.planSel = copy.id; save(); render(); toast('已复制');
  }
  else if (act === 'plan-toggle') {
    var tt = templateById(el.getAttribute('data-tpl'));
    if (!tt) return;
    tt.enabled = !tt.enabled; save(); render();
  }
  else if (act === 'plan-del') { delTemplate(el.getAttribute('data-tpl')); }
  else if (act === 'tpl-move') {
    var mt = templateById(el.getAttribute('data-tpl'));
    var from = +el.getAttribute('data-idx'), dir = +el.getAttribute('data-dir'), to = from + dir;
    if (mt && to >= 0 && to < mt.items.length) {
      var tmp = mt.items[from]; mt.items[from] = mt.items[to]; mt.items[to] = tmp;
      save(); render();
    }
  }
  else if (act === 'tpl-del-item') {
    var dt = templateById(el.getAttribute('data-tpl'));
    if (dt) { dt.items.splice(+el.getAttribute('data-idx'), 1); save(); render(); }
  }
  else if (act === 'tpl-add-ex') { openTplExercisePicker(); }
  else if (act === 'tpl-pick') {
    var pt = selectedTemplate();
    var exId = el.getAttribute('data-ex');
    if (pt && exId) {
      pt.items.push({ exerciseId: exId, sets: 3, repsMin: 8, repsMax: 12, weight: 0, restSec: db.settings.defaultRest });
      save(); closeLayer(); render();
    }
  }
  else if (act === 'note-del') { removeNote(el.getAttribute('data-id')); }
  else if (act === 'note-toggle') {
    var nn = (db.notes || []).filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
    if (nn) { nn.done = !nn.done; save(); refreshMemo(); }
  }
  else if (act === 'home-rest') { Timer.start(db.settings.defaultRest, null); toast('休息开始'); }
  else if (act === 'home-seed') { importDefaultPlans(); }
  else if (act === 'diet-day') {
    var dd = +el.getAttribute('data-d');
    ui.dietDate = dd === 0 ? todayKey() : addDays(ui.dietDate || todayKey(), dd);
    render();
  }
  else if (act === 'diet-target') { openTargetModal(); }
  else if (act === 'target-suggest') {
    var w = latestWeight();
    var sg = suggestTargets(el.getAttribute('data-mode'), w ? w.kg : 70);
    document.getElementById('tgKcal').value = sg.kcal;
    document.getElementById('tgP').value = sg.p;
    document.getElementById('tgC').value = sg.c;
    document.getElementById('tgF').value = sg.f;
  }
  else if (act === 'food-add') { openFoodDrawer(el.getAttribute('data-meal'), 'recent'); }
  else if (act === 'food-tab') {
    if (!ui._pick) return;
    openFoodDrawer(ui._pick.meal, el.getAttribute('data-tab'));
  }
  else if (act === 'food-pick') {
    if (!ui._pick) return;
    var pf = foodById(el.getAttribute('data-id'));
    if (!pf) return;
    ui._pick.foodId = pf.id;
    renderPortion(pf);
  }
  else if (act === 'food-back') { if (ui._pick) openFoodDrawer(ui._pick.meal, ui._pick.tab); }
  else if (act === 'food-confirm') { confirmFood(); }
  else if (act === 'food-del') { delFoodItem(el.getAttribute('data-meal'), +el.getAttribute('data-idx')); }
  else if (act === 'food-new') { newFoodModal(); }
  else if (act === 'meal-save') { saveMealTemplate(el.getAttribute('data-meal')); }
  else if (act === 'meal-apply') { openMealTemplates(el.getAttribute('data-meal')); }
  else if (act === 'meal-apply-one') { applyMealTemplate(el.getAttribute('data-meal'), el.getAttribute('data-tpl')); }
  else if (act === 'data-tab') { ui.dataTab = el.getAttribute('data-tab'); render(); }
  else if (act === 'weight-add') {
    var wi = document.getElementById('weightInput');
    var kg = Number(wi && wi.value);
    if (!kg || kg <= 0) { toast('请输入有效体重'); return; }
    db.weights = (db.weights || []).filter(function (w) { return w.date !== todayKey(); });
    db.weights.push({ date: todayKey(), kg: round1(kg) });
    save(); if (wi) wi.value = ''; render(); toast('已记录体重');
  }
  else if (act === 'export-data') { doExport(); }
  else if (act === 'import-data') { var fi = document.getElementById('importFile'); if (fi) fi.click(); }
  else if (act === 'clear-data') { clearAllData(); }
});
document.addEventListener('input', function (e) {
  if (e.target && e.target.closest && e.target.closest('input[data-set]')) { applySetting(e.target.closest('input[data-set]')); return; }
  if (e.target && e.target.id === 'memoInput') {
    var ta = e.target;
    clearTimeout(ui._memoT);
    ui._memoT = setTimeout(function () {
      var v = ta.value;
      if (!v.trim()) return;
      addNote(v);
      ta.value = '';
    }, 600);
    return;
  }
  var el = e.target.closest('[data-inp]');
  if (!el) return;
  var kind = el.getAttribute('data-inp');
  if (kind === 'tpl') {
    var tpl = templateById(el.getAttribute('data-tpl'));
    if (!tpl) return;
    var it = tpl.items[+el.getAttribute('data-idx')];
    if (!it) return;
    var v = Number(el.value);
    if (el.value.trim() === '' || isNaN(v) || v < 0) return;
    var k = el.getAttribute('data-k');
    it[k] = k === 'weight' ? v : Math.round(v);
    if (it.repsMax < it.repsMin) { if (k === 'repsMin') it.repsMax = it.repsMin; else it.repsMin = it.repsMax; }
    if (it.restSec < 1) it.restSec = 1;
    if (it.sets < 1) it.sets = 1;
    save();
    return;
  }
  var d = db.draft;
  if (!d) return;
  var entry = draftEntry(el.getAttribute('data-ex'));
  if (!entry) return;
  var s = entry.sets[+el.getAttribute('data-set')];
  if (!s) return;
  var raw = el.value.trim();
  if (raw !== '' && isNaN(Number(raw))) return;
  if (kind === 'w') s.weight = raw === '' ? '' : Number(raw);
  else s.reps = raw === '' ? '' : Math.max(0, Math.round(Number(raw)));
  save();
  updateProgressUI();
});
document.addEventListener('change', function (e) {
  if (e.target && e.target.id === 'importFile') { readImport(e.target.files && e.target.files[0]); e.target.value = ''; return; }
  var sel = e.target.closest('[data-sch]');
  if (sel) { db.schedule[sel.getAttribute('data-sch')] = sel.value || null; save(); render(); return; }
  var st = e.target.closest('[data-set]');
  if (st) { applySetting(st); }
});
document.addEventListener('dragstart', function (e) {
  var it = e.target.closest && e.target.closest('.tpl-item');
  if (!it) return;
  ui._drag = { tpl: it.getAttribute('data-tpl'), idx: +it.getAttribute('data-idx') };
  try { e.dataTransfer.setData('text/plain', String(ui._drag.idx)); e.dataTransfer.effectAllowed = 'move'; } catch (_) {}
});
document.addEventListener('dragover', function (e) {
  if (e.target.closest && e.target.closest('.tpl-item')) e.preventDefault();
});
document.addEventListener('drop', function (e) {
  var it = e.target.closest && e.target.closest('.tpl-item');
  if (!it || !ui._drag) return;
  e.preventDefault();
  var from = ui._drag.idx, to = +it.getAttribute('data-idx');
  var tpl = templateById(ui._drag.tpl);
  ui._drag = null;
  if (!tpl || isNaN(to) || from === to) return;
  var moved = tpl.items.splice(from, 1)[0];
  tpl.items.splice(to, 0, moved);
  save(); render();
});
document.addEventListener('keydown', function (e) {
  var tag = (document.activeElement && document.activeElement.tagName) || '';
  var typing = /INPUT|TEXTAREA|SELECT/.test(tag);
  if (e.altKey && /^[1-6]$/.test(e.key)) { e.preventDefault(); go(ROUTES[+e.key - 1].id); return; }
  if (e.key === 'Escape' && document.getElementById('layer').children.length) { closeLayer(); return; }
  if (e.key === 'Enter' && document.activeElement && document.activeElement.matches && document.activeElement.matches('[data-inp="r"]')) {
    e.preventDefault();
    var exId = document.activeElement.getAttribute('data-ex');
    var si = +document.activeElement.getAttribute('data-set');
    toggleSet(exId, si);
    focusNextSet(exId, si);
    return;
  }
  if (typing) return;
  if (e.code === 'Space' && ui.view === 'rest') { e.preventDefault(); Timer.toggle(); render(); }
  if (e.key === 'r' || e.key === 'R') { if (ui.view === 'rest') { Timer.reset(); render(); } }
});
function boot(){
  var r = load();
  ensureSeed();
  // 申请持久化存储：能降低浏览器在存储紧张时清掉数据的概率
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if (r.err === 'corrupt') {
    setTimeout(function () { toast('数据读取失败，已备份原始内容，请导入备份', { ms: 8000 }); }, 300);
  }
  onHash();
  if (!location.hash) location.hash = '#/home';
}
document.addEventListener('DOMContentLoaded', function () {
  boot();
  addEventListener('hashchange', onHash);
  addEventListener('pagehide', flush);
  addEventListener('beforeunload', flush);
  addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(); });
  setInterval(function () {
    var el = document.getElementById('elapsed');
    if (el && db && db.draft) el.textContent = fmtDur(elapsedSec(db.draft.startedAt));
  }, 1000);
  if (TESTING) { var s = document.createElement('script'); s.src = 'tests/suite.js'; document.body.appendChild(s); }
});
